services:
  dfi:
    build: .
    image: digital-footprint-investigator:latest
    container_name: dfi
    ports:
      - "5000:5000"
    volumes:
      # Persist cases, results and API keys across restarts
      - ./backend/data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/api/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
